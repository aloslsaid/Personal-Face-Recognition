name: Quality checks
on:
  push:
    branches: [main, "portfolio/**"]
  pull_request:
  workflow_dispatch:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
